<script type="application/ld+json">{"@context":"https://schema.org/","@type":"Product","name":"Wendigo models and props","description":"I got asked to make a wendigo/skinwalker monster and got carried away with it.... any whosies.I made a greater wendigo a lesser wendigo and a wendiga which I believe is the female name? plus a bunch of props cause I was going for like a diorama thing but ended up not liking said approach. comes with sacrifices on some pillars, pillars with no sacrifices, and a Brazier.The greater wendigo is just shy of 96 mm tall around 100 in his base. I have it cut into several pieces and the option to try and print it whole but he's a big'n. he comes on a 4 inch base as I was going for a gigantic creatureThe female wendigo is 53 mm tall, 64 mm on her 2 inch base.The male wendigo is 59 mm tall, 64 mm on his 2 inch base.The two pillars are 66mm and 60 mm tall and around 1 inch at the base.The female sacrifices are about 56 mm total but the model shares the same 36mm I usually sculpt in. The base should be around an inch.The male sacrifices sit at 55 mm tall but for some reason the base of the pillar is smaller than an inch.The brazier stands at 50 mm. its base is smaller but its total width comes to around 34 mm.I don't really know how I pulled off making the pillars all varying heights and I unfortunately don't feel like fixing that unless it gets brought up a bunch.Hope you like the models though!!","mpn":"6755519","sku":"6755519","url":"https://www.thingiverse.com/thing:6755519","image":["https://resize.thingiverse.com/?url=https://cdn.thingiverse.com/assets/ed/24/fe/5e/3e/87c88945-8bd0-4206-807d-9fee6e9b4570.jpg\u0026w=628\u0026h=472\u0026fit=contain\u0026cbg=white\u0026n=-1"],"brand":{"@type":"Brand","name":"SolAngavitzminis"},"offers":{"@type":"Offer","price":"0.00","priceCurrency":"USD","availability":"https://schema.org/InStock","url":"https://www.thingiverse.com/thing:6755519"},"mainEntityOfPage":{"@type":"CreativeWork","url":"https://www.
